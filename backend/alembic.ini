[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped revision filenames keep the versions/ directory readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No `sqlalchemy.url` here on purpose: migrations/env.py reads DATABASE_URL from
# the application settings so there is a single source of truth.

# Directory layout of the generated migration files.
version_path_separator = os

[post_write_hooks]
# Keep generated migrations formatted and lint-clean. The `exec` hook type is
# used because ruff installs a plain binary, not a console_scripts entry point
# (`console_scripts` hooks cannot resolve it).
hooks = ruff_lint, ruff_format
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging used by `alembic` itself (env.py calls fileConfig on this file).
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
